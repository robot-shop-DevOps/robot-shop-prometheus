name: Validate and Deploy Prometheus helm charts to Development

on:
  push:
    branches-ignore:
      - "main"
  
  pull_request:
    branches:
      - develop    

  workflow_dispatch:

env:
  NAMESPACE: prometheus
  PROMETHEUS_HELM_CHART_URL: https://prometheus-community.github.io/helm-charts
  PROMETHEUS_HELM_CHART_VERSION: 80.6.0
  RELEASE: prometheus-kube-stack
  CHART_PATH: ./.chart

jobs:
  validate:
    runs-on: robot-shop-runner-azure-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 3.9.0

      - name: Validate helm charts
        run: |
          cd ${{ env.CHART_PATH }}
          helm lint 

  deploy:
    if: ${{ github.ref_name == 'develop' }}
    needs: validate
    runs-on: robot-shop-runner-azure-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 3.9.0

      - name: Find project namespace
        run: |
          if kubectl get ns ${{ env.NAMESPACE }} > /dev/null; then
            echo "namespace=${{ env.NAMESPACE }}" >> $GITHUB_ENV
            echo "namespace_found=true" >> $GITHUB_ENV
          fi

      - name: Create project namespace
        if: ${{ env.namespace_found != 'true'}}
        run: |
          set -e
          if kubectl create ns ${{ env.NAMESPACE }} > /dev/null; then
            echo "Namespace ${{ env.NAMESPACE }} created."
          else
            echo "Namespace ${{ env.NAMESPACE }} failed to create."
          fi

      - name: Add Prometheus helm repo
        run: |
          helm repo add prometheus-community ${{ env.PROMETHEUS_HELM_CHART_URL }}
          helm repo update

      - name: Deploy Prometheus Kube Stack
        run: |
          helm upgrade ${{ env.RELEASE }} \
          prometheus-community/kube-prometheus-stack \
          --namespace ${{ env.NAMESPACE }} \
          --install \
          --version ${{ env.PROMETHEUS_HELM_CHART_VERSION }} \
          -f ${{ env.CHART_PATH }}/kube-prometheus-stack/values/values_dev.yaml \
          -f ${{ env.CHART_PATH }}/kube-state-metrics/values/values_dev.yaml \
          -f ${{ env.CHART_PATH }}/prometheus-node-exporter/values/values_dev.yaml